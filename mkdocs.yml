site_name: Baseball Stats API
site_description: A comprehensive baseball statistics tracking system with real-time game updates
site_author: Baseball Stats Team
repo_url: https://github.com/yourusername/baseball-stats
repo_name: baseball-stats

theme:
  name: material
  palette:
    primary: blue
    accent: green
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.highlight

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/installation.md
    - Configuration: getting-started/configuration.md
  - API Reference:
    - Team Stats: api/team-stats.md
    - Player Stats: api/player-stats.md
    - Game Updates: api/game-updates.md
  - Data Visualization:
    - Metabase Setup: visualization/metabase-setup.md
    - Dashboards: visualization/dashboards.md
  - Contributing: contributing.md

markdown_extensions:
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed
  - admonition
  - toc:
      permalink: true

plugins:
  - search